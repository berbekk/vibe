<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Чеклист выбора квартиры в Москве на долгий срок: район, дом, состояние, деньги, договор и быт.">
  <meta name="theme-color" content="#e8eef5">
  <title>НАДОЛГО — чеклист квартиры в Москве</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css?v=4">
  <link rel="stylesheet" href="css/styles.css?v=4">
  <link rel="stylesheet" href="css/checklist.css?v=4">
</head>
<body>
  <div class="shell">
    <header class="topbar" id="topbar">
      <a class="brand brand--compact" href="#" aria-label="Надолго">
        <span class="brand__mark">Надолго</span>
      </a>
      <div class="topbar__actions">
        <button type="button" class="btn btn--ghost" id="reset-btn" aria-label="Сбросить прогресс">
          Сбросить
        </button>
      </div>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <p class="hero__eyebrow">Москва · долгосрочная аренда</p>
      <h1 class="hero__title" id="hero-title">Надолго</h1>
      <p class="hero__lead">
        Чеклист выбора квартиры: шум, договор, отопление и то, что бесит только после въезда.
      </p>
    </section>

    <section class="progress-panel" aria-live="polite">
      <div class="progress-panel__row">
        <span class="progress-panel__label">Готовность</span>
        <strong class="progress-panel__value" id="progress-value">0%</strong>
      </div>
      <div class="progress-bar" aria-hidden="true">
        <div class="progress-bar__fill" id="progress-fill"></div>
      </div>
      <div class="progress-panel__meta" id="progress-meta"></div>
    </section>

    <div id="checklist-anchor"></div>

    <nav class="filters" id="filters" aria-label="Фильтры чеклиста"></nav>

    <p class="legend">
      <span><i class="critical"></i> Критично</span>
      <span><i class="important"></i> Важно</span>
      <span><i class="nice"></i> Полезно</span>
    </p>

    <main class="checklist" id="checklist" aria-label="Чеклист осмотра квартиры"></main>

    <footer class="footer">
      <p>
        Отметки сохраняются в этом браузере. Берите чеклист на просмотр — и проверьте квартиру ещё раз вечером.
      </p>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
